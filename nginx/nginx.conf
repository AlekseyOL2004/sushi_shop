server {
    listen 80;
    
    # Корінь, де лежатимуть зібрані файли React
    root /usr/share/nginx/html;
    index index.html;

    # Обробка API запитів - перенаправлення на бекенд
    # http://api:3001 - це звернення до сервісу "api" всередині мережі Docker
    location /users {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /menu-items {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /categories {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /reviews {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
    
    # Інший варіант для всіх API (якщо у вас є префікс /api в коді)
    # location /api/ {
    #    proxy_pass http://api:3001/;
    # }

    # Обробка Frontend (React SPA)
    location / {
        # Якщо файл не знайдено, віддаємо index.html (для React Router)
        try_files $uri $uri/ /index.html;
    }
}
