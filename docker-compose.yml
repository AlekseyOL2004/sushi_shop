version: '3.8'

services:
  # Nginx - єдина точка входу (порт 80)
  nginx:
    container_name: nginx_prod
    build:
      context: ./nginx
    ports:
      - '80:80'
    depends_on:
      - api
      - frontend
    volumes:
      # Монтуємо том, куди frontend поклав зібрані файли
      - frontend_build:/usr/share/nginx/html

  api:
    container_name: api_prod
    build:
      context: ./api
      args:
        NODE_IMAGE: node:22-bullseye-slim
    command: npm start
    # expose - відкриває порт тільки для інших контейнерів, не назовні
    expose:
      - '3001'
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      # Використовуємо MongoDB Atlas замість локального контейнера
      - MONGO_URL=${MONGO_URL:-mongodb+srv://admin:SecurePassword123@cluster0.aepmndb.mongodb.net/sushi_shop?retryWrites=true&w=majority}
    volumes:
      - ./api/uploads:/usr/src/app/uploads

  frontend:
    container_name: frontend_prod
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NODE_IMAGE: node:22-bullseye-slim
    # Після збірки копіюємо файли у спільний том
    volumes:
      - frontend_build:/usr/src/app/dist
    # Проста команда, щоб контейнер не падав відразу (або можна використовувати для build)
    command: sh -c "cp -r /usr/src/app/dist/* /usr/src/app/dist/ && echo 'Files copied'"

volumes:
  frontend_build: # Спільний том для передачі файлів від React до Nginx
