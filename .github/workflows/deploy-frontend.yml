name: Deploy Frontend to Azure App Service

on:
  push:
    branches: [ "main", "frontend" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: ztu-sushi-frontend
  AZURE_RESOURCE_GROUP: sushi-project-rg
  NODE_VERSION: '20'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit
        working-directory: frontend

      - name: Build application
        run: npm run build
        working-directory: frontend

      - name: Create deployment package
        run: |
          cd frontend
          
          # Очистити попередній deploy
          rm -rf deploy
          mkdir -p deploy
          
          # Скопіювати dist
          cp -r dist deploy/
          
          # Створити package.json
          cat > deploy/package.json << 'EOF'
          {
            "name": "sushi-frontend",
            "version": "1.0.0",
            "main": "server.js",
            "scripts": {
              "start": "node server.js"
            },
            "dependencies": {
              "express": "^4.18.2"
            },
            "engines": {
              "node": ">=20.0.0"
            }
          }
          EOF
          
          # Створити Express server
          cat > deploy/server.js << 'EOF'
          const express = require('express');
          const path = require('path');
          const app = express();
          const PORT = process.env.PORT || 8080;

          // Security headers
          app.use((req, res, next) => {
            res.setHeader('X-Content-Type-Options', 'nosniff');
            res.setHeader('X-Frame-Options', 'DENY');
            res.setHeader('X-XSS-Protection', '1; mode=block');
            next();
          });

          // Serve static files from dist
          app.use(express.static(path.join(__dirname, 'dist'), {
            maxAge: '1d',
            etag: true
          }));

          // Handle SPA routing - всі маршрути повертають index.html
          app.get('*', (req, res) => {
            res.sendFile(path.join(__dirname, 'dist', 'index.html'));
          });

          app.listen(PORT, '0.0.0.0', () => {
            console.log(`✅ Frontend server running on port ${PORT}`);
            console.log(`📂 Serving files from ${path.join(__dirname, 'dist')}`);
          });
          EOF
          
          # Встановити залежності
          cd deploy
          npm install --production --no-optional --prefer-offline

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: frontend/deploy

      - name: Display deployment info
        run: |
          echo "✅ Frontend deployed successfully!"
          echo "🌐 Frontend URL: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
