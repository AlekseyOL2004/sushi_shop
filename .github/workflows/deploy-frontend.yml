name: Deploy Frontend to Azure App Service

on:
  push:
    branches: [ "main", "frontend" ]
    paths:
      - 'frontend/**'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: ztu-sushi-frontend
  AZURE_RESOURCE_GROUP: sushi-project-rg
  NODE_VERSION: '20'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Login to Azure (to get API URL)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get API URL
        id: api-url
        run: |
          API_FQDN=$(az container show \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name sushi-api \
            --query ipAddress.fqdn \
            --output tsv 2>/dev/null || echo "ztu-sushi-api.polandcentral.azurecontainer.io")
          echo "api_url=http://$API_FQDN:3001" >> $GITHUB_OUTPUT
          echo "Using API URL: http://$API_FQDN:3001"

      - name: Install dependencies
        run: npm install
        working-directory: frontend

      - name: Build application
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE: ${{ steps.api-url.outputs.api_url }}

      - name: Create deployment package
        run: |
          cd frontend
          mkdir -p deploy/dist
          cp -r dist/* deploy/dist/
          cat > deploy/package.json << 'EOF'
          {
            "name": "sushi-frontend",
            "version": "1.0.0",
            "scripts": {
              "start": "npx serve -s dist -l 8080"
            },
            "dependencies": {
              "serve": "^14.2.0"
            }
          }
          EOF
          cd deploy && npm install --production

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: frontend/deploy

      - name: Display deployment info
        run: |
          echo "✅ Frontend deployed successfully!"
          echo "🌐 Frontend URL: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          echo "🔗 API URL: ${{ steps.api-url.outputs.api_url }}"
