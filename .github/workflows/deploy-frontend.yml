name: Deploy Frontend to Azure App Service

on:
  push:
    branches: [ "main", "frontend" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: ztu-sushi-frontend
  AZURE_RESOURCE_GROUP: sushi-project-rg
  NODE_VERSION: '20'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get API URL
        id: api-url
        run: |
          API_FQDN=$(az container show \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name sushi-api \
            --query ipAddress.fqdn \
            --output tsv 2>/dev/null || echo "ztu-sushi-api.polandcentral.azurecontainer.io")
          echo "api_url=http://$API_FQDN:3001" >> $GITHUB_OUTPUT
          echo "✅ Using API URL: http://$API_FQDN:3001"

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build application
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE: ${{ steps.api-url.outputs.api_url }}

      - name: Create deployment package
        run: |
          cd frontend
          
          # Створити чисту структуру деплою
          rm -rf deploy
          mkdir -p deploy
          
          # Скопіювати dist
          cp -r dist deploy/
          
          # Створити package.json
          cat > deploy/package.json << 'EOF'
          {
            "name": "sushi-frontend",
            "version": "1.0.0",
            "main": "server.js",
            "scripts": {
              "start": "node server.js"
            },
            "dependencies": {
              "express": "^4.18.2"
            },
            "engines": {
              "node": ">=20.0.0"
            }
          }
          EOF
          
          # Створити Express server
          cat > deploy/server.js << 'EOF'
          const express = require('express');
          const path = require('path');
          const app = express();
          const PORT = process.env.PORT || 8080;

          // Serve static files from dist
          app.use(express.static(path.join(__dirname, 'dist')));

          // Handle SPA routing - всі маршрути повертають index.html
          app.get('*', (req, res) => {
            res.sendFile(path.join(__dirname, 'dist', 'index.html'));
          });

          app.listen(PORT, '0.0.0.0', () => {
            console.log(`✅ Frontend server running on port ${PORT}`);
            console.log(`📂 Serving files from ${path.join(__dirname, 'dist')}`);
          });
          EOF
          
          # Встановити залежності
          cd deploy
          npm install --production --no-optional
          
          # Створити .deployment файл для Oryx
          cat > .deployment << 'EOF'
          [config]
          command = node server.js
          EOF

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: frontend/deploy

      - name: Display deployment info
        run: |
          echo "✅ Frontend deployed successfully!"
          echo "🌐 Frontend URL: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          echo "🔗 API URL: ${{ steps.api-url.outputs.api_url }}"
