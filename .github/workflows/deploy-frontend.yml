name: Deploy Frontend to Azure App Service

on:
  push:
    branches: [ "main", "frontend" ]  # <--- Додано frontend
    paths:
      - 'frontend/**'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: ztu-sushi-frontend
  AZURE_RESOURCE_GROUP: sushi-project-rg
  NODE_VERSION: '20'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build application
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE: https://ztu-sushi-backend.azurewebsites.net

      - name: Create deployment package
        run: |
          cd frontend
          mkdir -p deploy/dist
          cp -r dist/* deploy/dist/
          cat > deploy/package.json << 'EOF'
          {
            "name": "sushi-frontend",
            "version": "1.0.0",
            "scripts": {
              "start": "npx serve -s dist -l 8080"
            },
            "dependencies": {
              "serve": "^14.2.0"
            }
          }
          EOF
          cd deploy && npm install --production

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: frontend/deploy
