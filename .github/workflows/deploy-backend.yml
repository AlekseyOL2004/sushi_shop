          push: truerst 3 chars: ${DOCKER_USERNAME:0:3}***"
          tags: ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest  # <--- env замість secrets
        env:
  deploy-to-azure:SERNAME: ${{ secrets.DOCKER_USERNAME }}
    needs: build-and-push
    runs-on: ubuntu-latestcker Hub
    steps:es: docker/login-action@v3
      - name: Login to Azure
        uses: azure/login@v2ets.DOCKER_USERNAME }}
        with:sword: ${{ secrets.DOCKER_PASSWORD }}
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Build and push Docker image
      - name: Restart Azure Web Appion@v5
        run: |
          az webapp restart --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }}
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

  deploy-to-azure:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Restart Azure Web App
        run: |
          az webapp restart --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }}
