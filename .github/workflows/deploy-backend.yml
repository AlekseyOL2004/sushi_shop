name: Build and Deploy Backend

on:
  push:
    branches: [ "main", "frontend" ]
    paths:
      - 'api/**'
      - 'docker-compose.azure.yml'
  workflow_dispatch:

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_NAME: sushi-api
  AZURE_WEBAPP_NAME: ztu-sushi-backend
  AZURE_RESOURCE_GROUP: sushi-project-rg

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Debug крок для перевірки чи secret підтягується
      - name: Debug Docker Username
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "❌ ERROR: DOCKER_USERNAME is empty or not set!"
            echo "Please check GitHub Secrets settings"
            exit 1
          else
            echo "✅ DOCKER_USERNAME is set (length: ${#DOCKER_USERNAME} characters)"
            echo "First 3 chars: ${DOCKER_USERNAME:0:3}***"
          fi
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

  deploy-to-azure:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Restart Azure Web App
        run: |
          az webapp restart --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }}
