        uses: actions/checkout@v4

      - name: Log in to Docker Hub підтягується
        uses: docker/login-action@v3
        with:|
          username: ${{ env.DOCKER_USERNAME }}  # <--- Використовуємо env замість secrets"
          password: ${{ secrets.DOCKER_PASSWORD }} ]; then
            echo "❌ ERROR: DOCKER_USERNAME is empty or not set!"
