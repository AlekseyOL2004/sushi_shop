version: "3"
services:
  api:
    container_name: api_dev
    build:
      context: ./api
      dockerfile: Dockerfile.dev
      args:
        NODE_IMAGE: node:22-bullseye-slim
    command: npm run dev
    ports:
      - "3002:3001"
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - MONGO_URL=mongodb://api_db:27017/api
      - NODE_ENV=development
    volumes:
      - ./api/src:/usr/src/app/src
      - ./api/uploads:/usr/src/app/uploads
    depends_on:
      - api_db
    restart: unless-stopped

  frontend:
    container_name: frontend_dev
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        NODE_IMAGE: node:22-bullseye-slim
    command: npm start
    ports:
      - "3003:3000"
    environment:
      - VITE_API_BASE=http://localhost:3002
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    stdin_open: true
    tty: true
    depends_on:
      - api
    restart: unless-stopped

  api_db:
    container_name: api_db_dev
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_api:/data/db
    restart: unless-stopped

volumes:
  mongodb_api:
