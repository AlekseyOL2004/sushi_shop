version: '3.8'

services:
  # MongoDB з персистентністю в Azure
  api_db:
    image: mongo:latest
    container_name: api_db_azure
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: SecurePassword123
  # Backend API
  api:
    image: knm251oos/sushi-api:latest
    container_name: api_azure
    restart: always
    ports:
      # Azure маршрутизує вхідний трафік (80/443) на перший відкритий порт контейнера. 
      # Ми мапимо 80 контейнера на 3001 додатку.
      - "80:3001"
    environment:
      PORT: "3001"
      HOST: "0.0.0.0"
      # Використовуємо ім'я сервісу 'api_db' для підключення
      MONGO_URL: "mongodb://admin:SecurePassword123@api_db:27017/sushi_shop?authSource=admin"
      WEBSITES_PORT: "3001"
    depends_on:
      - api_db
